version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 9.x is under the OSMF EULA (see #22); patches on 8.0 stay allowed.
      - dependency-name: "JsonSchema.Net"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: "/docs/examples/playwright"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
