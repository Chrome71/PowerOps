name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet format --verify-no-changes
      - run: dotnet pack src/PowerOps.Cli -c Release -o artifacts
      - name: Smoke test the packed tool
        run: |
          dotnet tool install --tool-path ./tool --source ./artifacts PowerOps --prerelease
          ./tool/powerops --version
          ./tool/powerops analyze tests/fixtures --fail-on none

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          path: tests/fixtures/powerops-seed/v2
          tests: tests/fixtures/flowtests/seed
          upload-sarif: 'false'
          fail-on: none

  # Type-checks and lists the Playwright starter; running it needs a person's sign-in (docs/examples/playwright/README.md).
  playwright-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx playwright test --list
