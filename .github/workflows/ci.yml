name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Microsoft.Testing.Platform (xunit.v3) sends telemetry unless this is 1.
env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release -p:RestoreLockedMode=true
      - name: The Action's build, in locked mode
        run: dotnet build src/PowerOps.Cli -c Release -p:RestoreLockedMode=true
      - run: dotnet test -c Release --no-build
        env:
          POWEROPS_REQUIRE_TOOLS: ${{ runner.os != 'Windows' && '1' || '' }}

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      # dotnet list package exits 0 even when it finds a vulnerable package, so the script reads the JSON.
      - name: Fail on a vulnerable package
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive --format json --no-restore > vulnerable.json
          bash .github/scripts/vulnerable.sh vulnerable.json
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet pack src/PowerOps.Cli -c Release -o artifacts --no-restore
      - name: Smoke test the packed tool
        run: |
          dotnet tool install --tool-path ./tool --source ./artifacts PowerOps --prerelease
          ./tool/powerops --version
          ./tool/powerops analyze tests/fixtures --fail-on none
      - name: Build the binaries and the sample
        run: bash .github/scripts/release-assets.sh artifacts
      - name: Run the Linux binary
        run: |
          ./artifacts/powerops-linux-x64 --version
          unzip -q artifacts/powerops-sample.zip -d sample
          ./artifacts/powerops-linux-x64 analyze sample/powerops-sample/solution --fail-on none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts
          if-no-files-found: error
          retention-days: 1

  # Runs the Windows binary the package job built, as release.yml does before a release. Not a required check.
  windows-binary:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
      # Git Bash; the exe ends its lines with \r\n. A build that is not a release prints its version and commit.
      - name: Run the Windows binary
        shell: bash
        run: |
          printed="$(./powerops-win-x64.exe --version | tr -d '\r')"
          [[ "$printed" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]{40}$ ]] || { echo "::error::powerops-win-x64.exe prints $printed"; exit 1; }
          unzip -q powerops-sample.zip -d sample
          ./powerops-win-x64.exe analyze sample/powerops-sample/solution --fail-on none

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: tests/fixtures/powerops-seed/v2
          tests: tests/fixtures/flowtests/seed
          upload-sarif: 'false'
          fail-on: none

  # Type-checks and lists the Playwright starter; running it needs a person's sign-in (docs/examples/playwright/README.md).
  playwright-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/examples/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx playwright test --list
