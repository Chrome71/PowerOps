name: Skills smoke test

# Drives the planning skills with a simulated user (tests/smoke/skills-smoke.sh). It costs model
# credits, so it runs weekly on the maintainer's credentials, never per build. Add the repository
# secrets ANTHROPIC_API_KEY (Claude Code) and OPENAI_API_KEY (Codex); a job whose secret is
# missing skips cleanly.
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            package: '@anthropic-ai/claude-code@2.1.303'
          - agent: codex
            package: '@openai/codex@0.163.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT: ${{ matrix.agent }}
      PACKAGE: ${{ matrix.package }}
    steps:
      # The keys are given only to the steps that need them, never to checkout or npm install.
      - name: Check credentials
        id: creds
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
        run: |
          if [ "$AGENT" = claude ]; then key="$ANTHROPIC_API_KEY"; name=ANTHROPIC_API_KEY; else key="$OPENAI_API_KEY"; name=OPENAI_API_KEY; fi
          if [ -z "$key" ]; then
            echo "::notice::$name is not set; skipping the $AGENT smoke test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.skip != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the agent CLI
        if: steps.creds.outputs.skip != 'true'
        shell: bash
        run: npm install --global "$PACKAGE"
      - name: Run the smoke test
        if: steps.creds.outputs.skip != 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
        run: |
          if [ "$AGENT" = codex ]; then printenv OPENAI_API_KEY | codex login --with-api-key; fi
          tests/smoke/skills-smoke.sh "$AGENT"
